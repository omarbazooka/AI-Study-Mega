name: Build backend image for Azure

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/build-backend-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/omarbazooka/ai-study-api:azure-latest
            ghcr.io/omarbazooka/ai-study-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/omarbazooka/AI-Study-Mega
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
