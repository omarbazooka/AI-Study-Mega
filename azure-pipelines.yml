trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/backend/**
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  acrName: nabdakacr67a69e
  resourceGroup: nabdak-rg
  containerAppEnvironment: nabdak-env
  containerAppName: ai-study-api
  imageName: ai-study-api

stages:
  - stage: BuildAndPush
    displayName: Build and push backend image
    jobs:
      - job: Build
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Build Docker image and push to ACR
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                LOGIN_SERVER=$(az acr show -n "$(acrName)" --query loginServer -o tsv)
                az acr login -n "$(acrName)"

                docker build \
                  -t "$LOGIN_SERVER/$(imageName):$(Build.BuildId)" \
                  -t "$LOGIN_SERVER/$(imageName):latest" \
                  "$(Build.SourcesDirectory)/apps/backend"

                docker push "$LOGIN_SERVER/$(imageName):$(Build.BuildId)"
                docker push "$LOGIN_SERVER/$(imageName):latest"

  - stage: Deploy
    displayName: Deploy Azure Container App
    dependsOn: BuildAndPush
    jobs:
      - job: DeployBackend
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Create or update AI Study backend
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az extension add --name containerapp --upgrade --yes >/dev/null 2>&1 || true

                LOGIN_SERVER=$(az acr show -n "$(acrName)" --query loginServer -o tsv)
                IMAGE="$LOGIN_SERVER/$(imageName):$(Build.BuildId)"
                ACR_USER=$(az acr credential show -n "$(acrName)" --query username -o tsv)
                ACR_PASS=$(az acr credential show -n "$(acrName)" --query 'passwords[0].value' -o tsv)

                if az containerapp show -g "$(resourceGroup)" -n "$(containerAppName)" >/dev/null 2>&1; then
                  az containerapp registry set \
                    -g "$(resourceGroup)" \
                    -n "$(containerAppName)" \
                    --server "$LOGIN_SERVER" \
                    --username "$ACR_USER" \
                    --password "$ACR_PASS" >/dev/null

                  az containerapp update \
                    -g "$(resourceGroup)" \
                    -n "$(containerAppName)" \
                    --image "$IMAGE" \
                    --min-replicas 0 \
                    --max-replicas 1 \
                    --cpu 1.0 \
                    --memory 2Gi >/dev/null
                else
                  az containerapp create \
                    -g "$(resourceGroup)" \
                    -n "$(containerAppName)" \
                    --environment "$(containerAppEnvironment)" \
                    --image "$IMAGE" \
                    --registry-server "$LOGIN_SERVER" \
                    --registry-username "$ACR_USER" \
                    --registry-password "$ACR_PASS" \
                    --target-port 8080 \
                    --ingress external \
                    --min-replicas 0 \
                    --max-replicas 1 \
                    --cpu 1.0 \
                    --memory 2Gi >/dev/null
                fi

                FQDN=$(az containerapp show \
                  -g "$(resourceGroup)" \
                  -n "$(containerAppName)" \
                  --query properties.configuration.ingress.fqdn \
                  -o tsv)

                echo "AI Study backend: https://${FQDN}"
                echo "Next step: configure runtime secrets using deploy/configure-azure-ai-study.sh"
