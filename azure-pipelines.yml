trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/backend/**
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  acrName: nabdakacr67a69e
  resourceGroup: nabdak-rg
  containerAppEnvironment: nabdak-env
  containerAppName: ai-study-api
  imageName: ai-study-api

steps:
  - checkout: self
    clean: true

  - task: AzureContainerApps@1
    displayName: Build and deploy AI Study backend
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      appSourcePath: '$(Build.SourcesDirectory)/apps/backend'
      dockerfilePath: '$(Build.SourcesDirectory)/apps/backend/Dockerfile'
      acrName: '$(acrName)'
      imageToBuild: '$(acrName).azurecr.io/$(imageName):$(Build.BuildId)'
      containerAppName: '$(containerAppName)'
      resourceGroup: '$(resourceGroup)'
      containerAppEnvironment: '$(containerAppEnvironment)'
      targetPort: '8080'
      ingress: external

  - task: AzureCLI@2
    displayName: Configure scale-to-zero
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az extension add --name containerapp --upgrade --yes >/dev/null 2>&1 || true
        az containerapp update \
          --name "$(containerAppName)" \
          --resource-group "$(resourceGroup)" \
          --min-replicas 0 \
          --max-replicas 1 >/dev/null

        FQDN=$(az containerapp show \
          --name "$(containerAppName)" \
          --resource-group "$(resourceGroup)" \
          --query properties.configuration.ingress.fqdn \
          --output tsv)

        echo "AI Study backend: https://${FQDN}"
